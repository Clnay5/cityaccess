[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cityaccess"
version = "0.1.0"
description = "Auditable walking-network accessibility from real OpenStreetMap data"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "networkx>=3.3,<4", "shapely>=2,<3", "pyproj>=3.6,<4", "requests>=2.32,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
include = ["cityaccess*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
